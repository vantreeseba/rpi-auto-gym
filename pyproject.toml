[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rpi-auto-gym"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "opencv-python",
    "Pillow",  # debug view
]

[project.optional-dependencies]
mediapipe = ["mediapipe"]
coral = ["ai-edge-litert"]
hailo = []  # installed via system packages, see README

[project.scripts]
rpi-auto-gym = "src.main:main"

[tool.setuptools.packages.find]
# The top-level package is literally named "src" (imports are src.main etc.).
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["src"]
